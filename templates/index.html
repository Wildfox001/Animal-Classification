<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cattle & Buffalo Classifier | AI Model</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0; padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: radial-gradient(circle at top right, #111827, #1e293b);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #f8fafc;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      backdrop-filter: blur(20px);
      padding: 3rem 2.5rem;
      width: 380px;
      text-align: center;
      box-shadow: 0 0 25px rgba(0,0,0,0.4);
      animation: fadeIn 1.2s ease;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(90deg, #60a5fa, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    p {
      color: #cbd5e1;
      font-size: 0.9rem;
      margin-bottom: 1.8rem;
    }

    .upload-box {
      border: 2px dashed rgba(255, 255, 255, 0.25);
      border-radius: 14px;
      padding: 30px;
      margin-bottom: 25px;
      transition: 0.3s ease;
    }

    .upload-box:hover {
      background: rgba(255,255,255,0.08);
      border-color: #60a5fa;
    }

    input[type="file"] {
      width: 100%;
      color: #cbd5e1;
      background: transparent;
      border: none;
      outline: none;
    }

    button {
      background: linear-gradient(90deg, #60a5fa, #818cf8);
      border: none;
      border-radius: 10px;
      color: #fff;
      padding: 12px 20px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 15px rgba(129,140,248,0.4);
    }

    footer {
      font-size: 0.8rem;
      color: #64748b;
      margin-top: 1rem;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🐄 Animal Classifier</h1>
    <p>Upload an image to identify if it’s Cattle or Buffalo using AI.</p>
    <form action="/" method="post" enctype="multipart/form-data">
      <div class="upload-box">
        <input type="file" name="file" accept="image/*" required>
      </div>
      <button type="submit">Analyze Image 🚀</button>
    </form>
    <footer>AI Model • Flask + TensorFlow</footer>
  </div>
</body>
</html>
